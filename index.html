<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kopi Setengah-4 - Sistem Kasir & Manajemen Menu</title>
    <!-- Firebase App dan Database SDK (Ver 8) -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    
    <style>
        :root {
            --bg-color: #120c06;
            --card-bg: rgba(43, 29, 14, 0.6);
            --text-color: #f5ebe0;
            --accent-color: #d4a373;
            --accent-hover: #e6ccb2;
            --border-color: rgba(212, 163, 115, 0.2);
            --danger-color: #e63946;
            --success-color: #2a9d8f;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            background-image: linear-gradient(135deg, #120c06 0%, #2b1d0e 100%);
            min-height: 100vh;
            padding: 20px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 20px;
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            border: 1px solid var(--border-color);
        }

        h1 {
            color: var(--accent-color);
            font-size: 24px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            overflow-x: auto;
            padding-bottom: 5px;
        }

        .tab-btn {
            background: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.3s ease;
        }

        .tab-btn.active, .tab-btn:hover {
            background: var(--accent-color);
            color: #120c06;
            font-weight: bold;
        }

        .main-panel {
            background: var(--card-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--border-color);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: var(--accent-color);
            font-size: 14px;
        }

        select, input, button {
            width: 100%;
            padding: 12px;
            background: rgba(18, 12, 6, 0.8);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-radius: 8px;
            font-size: 16px;
            outline: none;
        }

        button {
            background: var(--accent-color);
            color: #120c06;
            font-weight: bold;
            cursor: pointer;
            border: none;
            transition: background 0.2s;
        }

        button:hover {
            background: var(--accent-hover);
        }

        .grid-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        .grid-table th, .grid-table td {
            border: 1px solid var(--border-color);
            padding: 12px 10px;
            text-align: left;
            font-size: 14px;
        }

        .grid-table th {
            background: rgba(212, 163, 115, 0.1);
            color: var(--accent-color);
        }

        .grid-table tr:nth-child(even) {
            background: rgba(255, 255, 255, 0.02);
        }

        /* Modal / Dialog Box Custom */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background: #1e140a;
            border: 1px solid var(--accent-color);
            padding: 20px;
            border-radius: 15px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-danger { background: var(--danger-color); color: #fff; }
        .btn-secondary { background: #4a3525; color: #fff; }

        .hidden { display: none !important; }

        @media (max-width: 768px) {
            body { padding: 10px; }
            .grid-table th, .grid-table td { padding: 8px 5px; font-size: 12px; }
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Kopi Setengah-4</h1>
        <p style="font-size: 12px; color: var(--accent-color); margin-top: 5px;">Sistem Sinkronisasi Menu & Kasir Multi-Cabang</p>
    </header>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('kasir')">Kasir & Menu</button>
        <button class="tab-btn" onclick="switchTab('admin')">Manajemen Menu (Admin)</button>
    </div>

    <!-- PANEL KASIR / VIEW MENU -->
    <div id="panel-kasir" class="main-panel">
        <div class="form-group">
            <label for="view-branch">Pilih Cabang Aktif Anda:</label>
            <select id="view-branch" onchange="renderMenu()">
                <option value="KS4-TD">Tanjung Duren (KS4-TD)</option>
                <option value="KS4-KB">Kebon Jeruk (KS4-KB)</option>
                <option value="KS4-CK" selected>Cikini (KS4-CK)</option>
                <option value="KS4-MT">Menteng (KS4-MT)</option>
                <option value="KS4-CP">Cempaka Putih (KS4-CP)</option>
                <option value="KS4-OT">Otista (KS4-OT)</option>
                <option value="KS4-ST">Sunter (KS4-ST)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="view-mode">Tipe Penjualan:</label>
            <select id="view-mode" onchange="renderMenu()">
                <option value="OFFLINE">OFFLINE (Dine In / Take Away)</option>
                <option value="ONLINE">ONLINE (Grab / Gojek / Shopee)</option>
            </select>
        </div>

        <h3 style="margin-top:20px; margin-bottom: 10px; color: var(--accent-color);">Daftar Menu Aktif di Kasir</h3>
        <table class="grid-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nama Menu</th>
                    <th>Kategori / Spek</th>
                    <th>Harga Base/Offline</th>
                    <th class="col-ojol hidden">Grab</th>
                    <th class="col-ojol hidden">Gojek</th>
                    <th class="col-ojol hidden">Shopee</th>
                </tr>
            </thead>
            <tbody id="menu-kasir-tbody">
                <!-- Diisi otomatis via JavaScript -->
            </tbody>
        </table>
    </div>

    <!-- PANEL ADMIN MANAJEMEN MENU -->
    <div id="panel-admin" class="main-panel hidden">
        <h3 style="color: var(--accent-color); margin-bottom: 15px;">Pusat Kontrol Perubahan Harga & Sinkronisasi</h3>
        
        <div class="form-group">
            <label for="mgmt-branch">Target Sinkronisasi Cabang:</label>
            <select id="mgmt-branch" onchange="renderMgmt()">
                <option value="ALL">✅ SEMUA CABANG SEKALIGUS (Template Global)</option>
                <option value="KS4-TD">Tanjung Duren (KS4-TD)</option>
                <option value="KS4-KB">Kebon Jeruk (KS4-KB)</option>
                <option value="KS4-CK">Cikini (KS4-CK)</option>
                <option value="KS4-MT">Menteng (KS4-MT)</option>
                <option value="KS4-CP">Cempaka Putih (KS4-CP)</option>
                <option value="KS4-OT">Otista (KS4-OT)</option>
                <option value="KS4-ST">Sunter (KS4-ST)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="mgmt-mode">Mode Menu:</label>
            <select id="mgmt-mode" onchange="renderMgmt()">
                <option value="OFFLINE">OFFLINE</option>
                <option value="ONLINE">ONLINE</option>
            </select>
        </div>

        <table class="grid-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nama Menu</th>
                    <th>Harga Saat Ini</th>
                    <th>Aksi</th>
                </tr>
            </thead>
            <tbody id="menu-mgmt-tbody">
                <!-- Diisi otomatis via JavaScript -->
            </tbody>
        </table>
    </div>
</div>

<!-- MODAL EDIT MENU -->
<div id="edit-modal" class="modal">
    <div class="modal-content">
        <h3 style="color:var(--accent-color); margin-bottom: 15px;">Ubah Informasi Menu</h3>
        <input type="hidden" id="edit-menu-branch">
        <input type="hidden" id="edit-menu-mode">
        <input type="hidden" id="edit-menu-id">

        <div class="form-group">
            <label>Nama Menu Base:</label>
            <input type="text" id="edit-menu-name">
        </div>
        <div class="form-group">
            <label id="label-price-base">Harga Base / Offline (Rp):</label>
            <input type="number" id="edit-menu-price">
        </div>

        <!-- Ojol Field container (Akan muncul dinamis jika tipe Online) -->
        <div id="ojol-fields" class="hidden">
            <div class="form-group">
                <label>Harga GrabFood (Rp):</label>
                <input type="number" id="edit-menu-price-grab">
            </div>
            <div class="form-group">
                <label>Harga GoFood (Rp):</label>
                <input type="number" id="edit-menu-price-gojek">
            </div>
            <div class="form-group">
                <label>Harga ShopeeFood (Rp):</label>
                <input type="number" id="edit-menu-price-shopee">
            </div>
        </div>

        <div class="modal-actions">
            <button type="button" onclick="saveEditedMenu()">Simpan & Sinkronkan</button>
            <button type="button" class="btn-secondary" onclick="closeModal()">Batal</button>
        </div>
    </div>
</div>

<script>
    // ==========================================
    // 1. KONFIGURASI FIREBASE DATABASE Anda
    // ==========================================
    const firebaseConfig = {
        databaseURL: "https://kopi-setengah-4-default-rtdb.firebaseio.com" // Sesuaikan URL database Anda di sini
    };
    
    // Inisialisasi Firebase jika belum diinisiasi
    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    
    const db = firebase.database();
    const menuRef = db.ref('master_menu_v40');

    // Variabel Penampung Data Lokal
    let allMenusData = {};

    // Ambil Helper Amankan Array Data dari Firebase
    function getSafeArray(obj) {
        if (!obj) return [];
        if (Array.isArray(obj)) return obj.filter(x => x !== null);
        return Object.values(obj);
    }

    // ==========================================
    // 2. LIFECYCLE & EVENT HANDLER DATABASE
    // ==========================================
    // Listen data secara Realtime dari node master_menu_v40
    menuRef.on('value', (snapshot) => {
        const data = snapshot.val();
        if (data) {
            allMenusData = data;
        } else {
            // Seeding Struktur Dasar Dummy Jika Node Masih Kosong Total
            allMenusData = {
                "ALL": {
                    "OFFLINE": [
                        { id: 101, name: "Kopi Idealis | ICE | WADAH:Cup Small,QTY:1,SUSU:1,NON:0", price: 18000, cat: "ICE" },
                        { id: 102, name: "Matcha Latte | ICE | WADAH:Cup Large,QTY:1,SUSU:1,NON:0", price: 22000, cat: "ICE" }
                    ],
                    "ONLINE": [
                        { id: 101, name: "Kopi Idealis | ICE | WADAH:Cup Small,QTY:1,SUSU:1,NON:0", price: 22000, priceGrab: 22000, priceGojek: 23000, priceShopee: 22000, cat: "ICE" },
                        { id: 102, name: "Matcha Latte | ICE | WADAH:Cup Large,QTY:1,SUSU:1,NON:0", price: 26000, priceGrab: 26000, priceGojek: 27000, priceShopee: 26000, cat: "ICE" }
                    ]
                },
                "KS4-CK": { "OFFLINE": [], "ONLINE": [] },
                "KS4-TD": { "OFFLINE": [], "ONLINE": [] },
                "KS4-KB": { "OFFLINE": [], "ONLINE": [] },
                "KS4-MT": { "OFFLINE": [], "ONLINE": [] },
                "KS4-CP": { "OFFLINE": [], "ONLINE": [] },
                "KS4-OT": { "OFFLINE": [], "ONLINE": [] },
                "KS4-ST": { "OFFLINE": [], "ONLINE": [] }
            };
            menuRef.set(allMenusData);
        }
        
        // Auto Render Layar yang Sedang Dibuka setelah Data Diambil/Diubah
        renderMenu();
        renderMgmt();
    });

    // Fungsi Penggabungan Menu Warisan (ALL) dengan Data Custom tingkat Cabang
    function buildMergedBranchMenu(branch, mode) {
        let globalItems = [];
        if (allMenusData["ALL"] && allMenusData["ALL"][mode]) {
            globalItems = getSafeArray(allMenusData["ALL"][mode]);
        }

        let branchItems = [];
        if (branch !== "ALL" && allMenusData[branch] && allMenusData[branch][mode]) {
            branchItems = getSafeArray(allMenusData[branch][mode]);
        }

        // Gabungkan: Ambil dari cabang jika ada override, jika tidak ada pakai bawaan global (ALL)
        let merged = [];
        globalItems.forEach(gItem => {
            let bItem = branchItems.find(x => x.id == gItem.id);
            if (bItem) {
                merged.push(bItem); // Override terpakai
            } else {
                merged.push(gItem); // Menggunakan template bawaan
            }
        });

        // Tambahkan juga jika di cabang memiliki item ID unik baru yang tidak ada di ALL
        branchItems.forEach(bItem => {
            if (!merged.some(x => x.id == bItem.id)) {
                merged.push(bItem);
            }
        });

        return merged;
    }

    // ==========================================
    // 3. LOGIKA RENDER TAMPILAN (UI)
    // ==========================================
    function renderMenu() {
        const branch = document.getElementById('view-branch').value;
        const mode = document.getElementById('view-mode').value;
        const tbody = document.getElementById('menu-kasir-tbody');
        tbody.innerHTML = "";

        const ojolCols = document.querySelectorAll('.col-ojol');
        if (mode === 'ONLINE') {
            ojolCols.forEach(el => el.classList.remove('hidden'));
        } else {
            ojolCols.forEach(el => el.classList.add('hidden'));
        }

        const items = buildMergedBranchMenu(branch, mode);

        if(items.length === 0) {
            tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;">Tidak ada menu aktif. Silakan isi di manajemen menu.</td></tr>`;
            return;
        }

        items.forEach(item => {
            let parts = item.name.split(' | ');
            let baseName = parts[0] || item.name;
            let spec = parts[1] || item.cat || '-';

            let tr = document.createElement('tr');
            if (mode === 'OFFLINE') {
                tr.innerHTML = `
                    <td>${item.id}</td>
                    <td style="font-weight:bold; color:var(--accent-hover);">${baseName}</td>
                    <td><small>${spec}</small></td>
                    <td>Rp ${Number(item.price).toLocaleString('id-ID')}</td>
                `;
            } else {
                tr.innerHTML = `
                    <td>${item.id}</td>
                    <td style="font-weight:bold; color:var(--accent-hover);">${baseName}</td>
                    <td><small>${spec}</small></td>
                    <td>Rp ${Number(item.price).toLocaleString('id-ID')}</td>
                    <td style="color:#f4a261">Rp ${Number(item.priceGrab || item.price).toLocaleString('id-ID')}</td>
                    <td style="color:#e76f51">Rp ${Number(item.priceGojek || item.price).toLocaleString('id-ID')}</td>
                    <td style="color:#2a9d8f">Rp ${Number(item.priceShopee || item.price).toLocaleString('id-ID')}</td>
                `;
            }
            tbody.appendChild(tr);
        });
    }

    function renderMgmt() {
        const branch = document.getElementById('mgmt-branch').value;
        const mode = document.getElementById('mgmt-mode').value;
        const tbody = document.getElementById('menu-mgmt-tbody');
        tbody.innerHTML = "";

        // Tampilkan list data berdasarkan target cabang yang dipilih admin
        const items = buildMergedBranchMenu(branch, mode);

        items.forEach(item => {
            let parts = item.name.split(' | ');
            let baseName = parts[0] || item.name;
            
            let displayPrice = `Rp ${Number(item.price).toLocaleString('id-ID')}`;
            if(mode === 'ONLINE') {
                displayPrice = `Base: Rp ${Number(item.price).toLocaleString('id-ID')} <br>
                                <small style="color:rgba(245,235,224,0.6)">Grab: ${Number(item.priceGrab || item.price).toLocaleString('id-ID')} | Gojek: ${Number(item.priceGojek || item.price).toLocaleString('id-ID')}</small>`;
            }

            let tr = document.createElement('tr');
            tr.innerHTML = `
                <td>${item.id}</td>
                <td>${baseName}</td>
                <td>${displayPrice}</td>
                <td>
                    <button style="padding: 6px 12px; font-size:12px;" onclick="openEditModal('${branch}', '${mode}', ${item.id})">Ubah Harga</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    // ==========================================
    // 4. MODAL DIALOG & CONTROL SINKRONISASI
    // ==========================================
    function openEditModal(branch, mode, id) {
        document.getElementById('edit-menu-branch').value = branch;
        document.getElementById('edit-menu-mode').value = mode;
        document.getElementById('edit-menu-id').value = id;

        // Cari item data saat ini
        const items = buildMergedBranchMenu(branch, mode);
        const item = items.find(x => x.id == id);

        if(item) {
            let parts = item.name.split(' | ');
            document.getElementById('edit-menu-name').value = parts[0] || item.name;
            document.getElementById('edit-menu-price').value = item.price || 0;

            const ojolBox = document.getElementById('ojol-fields');
            const labelBase = document.getElementById('label-price-base');

            if(mode === 'ONLINE') {
                ojolBox.classList.remove('hidden');
                labelBase.innerText = "Harga Base Online / Web (Rp):";
                document.getElementById('edit-menu-price-grab').value = item.priceGrab || item.price || 0;
                document.getElementById('edit-menu-price-gojek').value = item.priceGojek || item.price || 0;
                document.getElementById('edit-menu-price-shopee').value = item.priceShopee || item.price || 0;
            } else {
                ojolBox.classList.add('hidden');
                labelBase.innerText = "Harga Base / Offline (Rp):";
            }
        }

        document.getElementById('edit-modal').style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('edit-modal').style.display = 'none';
    }

    // INTERPRETASI PERBAIKAN UTAMA: LOGIKA SINKRONISASI DUA ARAH
    function saveEditedMenu() {
        const branch = document.getElementById('edit-menu-branch').value;
        const mode = document.getElementById('edit-menu-mode').value;
        const id = document.getElementById('edit-menu-id').value;
        
        const newName = document.getElementById('edit-menu-name').value.trim();
        const newPrice = parseInt(document.getElementById('edit-menu-price').value);
        
        if(!newName || isNaN(newPrice)) {
            alert("Nama dan Harga tidak boleh kosong!");
            return;
        }
        
        let newPriceGrab = newPrice;
        let newPriceGojek = newPrice;
        let newPriceShopee = newPrice;
        
        if (mode === 'ONLINE') {
            newPriceGrab = parseInt(document.getElementById('edit-menu-price-grab').value) || newPrice;
            newPriceGojek = parseInt(document.getElementById('edit-menu-price-gojek').value) || newPrice;
            newPriceShopee = parseInt(document.getElementById('edit-menu-price-shopee').value) || newPrice;
        }

        // PROSES SINKRONISASI DUA ARAH BERDASARKAN TARGET AKSI
        if (branch === "ALL") {
            // SKENARIO A: Perubahan di Global Admin ("SEMUA CABANG SEKALIGUS")
            // Wajib loop ke node 'ALL' dan seluruh sub-cabang agar semua kasir ter-update instan.
            let allBranches = ["ALL", "KS4-TD", "KS4-KB", "KS4-CK", "KS4-MT", "KS4-CP", "KS4-OT", "KS4-ST"];
            
            allBranches.forEach(b => {
                if (!allMenusData[b]) allMenusData[b] = {};
                if (!allMenusData[b][mode]) allMenusData[b][mode] = [];

                let arr = getSafeArray(allMenusData[b][mode]);
                let item = arr.find(x => x.id == id);
                if (item) {
                    let parts = item.name.split(' | ');
                    let category = parts[1] || item.cat || 'ICE';
                    let metadata = parts[2] || 'WADAH:Tanpa Wadah,QTY:0,SUSU:0,NON:0';
                    
                    item.name = `${newName} | ${category} | ${metadata}`;
                    item.price = newPrice;
                    if (mode === 'ONLINE') {
                        item.priceGrab = newPriceGrab;
                        item.priceGojek = newPriceGojek;
                        item.priceShopee = newPriceShopee;
                    }
                } else if (b === "ALL") {
                    // Jika di ALL entah bagaimana terhapus, kita buat baru
                    allMenusData[b][mode].push({
                        id: parseInt(id),
                        name: `${newName} | ICE | WADAH:Cup Small,QTY:1,SUSU:1,NON:0`,
                        price: newPrice,
                        priceGrab: newPriceGrab,
                        priceGojek: newPriceGojek,
                        priceShopee: newPriceShopee,
                        cat: "ICE"
                    });
                }
            });
        } else {
            // SKENARIO B: Cabang spesifik mengubah harga (atau admin memilih edit per-cabang)
            // Hanya memperbarui cabang target bersangkutan agar tidak mengganggu cabang lain
            if (!allMenusData[branch]) allMenusData[branch] = {};
            if (!allMenusData[branch][mode]) allMenusData[branch][mode] = [];

            let arr = getSafeArray(allMenusData[branch][mode]);
            let item = arr.find(x => x.id == id);
            
            if (item) {
                let parts = item.name.split(' | ');
                let category = parts[1] || item.cat || 'ICE';
                let metadata = parts[2] || 'WADAH:Tanpa Wadah,QTY:0,SUSU:0,NON:0';
                
                item.name = `${newName} | ${category} | ${metadata}`;
                item.price = newPrice;
                if (mode === 'ONLINE') {
                    item.priceGrab = newPriceGrab;
                    item.priceGojek = newPriceGojek;
                    item.priceShopee = newPriceShopee;
                }
            } else {
                // Kasus jika cabang belum punya override data independen (masih pakai data warisan ALL),
                // Kita kloning data base-nya ke cabang ini dengan penyesuaian harga baru.
                let globalArr = getSafeArray(allMenusData["ALL"][mode]);
                let globalItem = globalArr.find(x => x.id == id);
                
                let category = "ICE";
                let metadata = "WADAH:Cup Small,QTY:1,SUSU:1,NON:0";
                if(globalItem) {
                    let parts = globalItem.name.split(' | ');
                    category = parts[1] || globalItem.cat || 'ICE';
                    metadata = parts[2] || 'WADAH:Cup Small,QTY:1,SUSU:1,NON:0';
                }

                allMenusData[branch][mode].push({
                    id: parseInt(id),
                    name: `${newName} | ${category} | ${metadata}`,
                    price: newPrice,
                    priceGrab: newPriceGrab,
                    priceGojek: newPriceGojek,
                    priceShopee: newPriceShopee,
                    cat: category
                });
            }
        }
        
        // Simpan pembaruan struktur ke Firebase Database
        menuRef.set(allMenusData).then(() => {
            alert("Berhasil! Sinkronisasi dua arah database sukses.");
            closeModal();
            renderMgmt();
            renderMenu();
        }).catch(err => {
            alert("Sinkronisasi gagal: " + err.message);
        });
    }

    // Navigasi Tab Sederhana
    function switchTab(tabName) {
        const tabBtns = document.querySelectorAll('.tab-btn');
        tabBtns.forEach(btn => btn.classList.remove('active'));

        document.getElementById('panel-kasir').classList.add('hidden');
        document.getElementById('panel-admin').classList.add('hidden');

        if (tabName === 'kasir') {
            document.getElementById('panel-kasir').classList.remove('hidden');
            tabBtns[0].classList.add('active');
            renderMenu();
        } else {
            document.getElementById('panel-admin').classList.remove('hidden');
            tabBtns[1].classList.add('active');
            renderMgmt();
        }
    }
</script>
</body>
</html>
